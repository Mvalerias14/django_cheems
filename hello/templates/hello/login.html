<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión</title>
    <style>
        body { font-family: sans-serif; background: #f2f4f7; display: flex;
               justify-content: center; align-items: center; height: 100vh; margin: 0; }
        form { background: #fff; padding: 32px; border-radius: 8px; width: 300px;
               box-shadow: 0 2px 8px rgba(0,0,0,.15); }
        h1 { margin-top: 0; font-size: 22px; }
        label { display: block; margin-top: 12px; font-size: 14px; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { width: 100%; margin-top: 20px; padding: 10px; cursor: pointer; }
        .error { color: #b00020; margin-top: 12px; font-size: 14px; }
    </style>
</head>
<body>
    <form method="post">
        {% csrf_token %}
        <h1>Iniciar sesión</h1>
        <label for="account">Cuenta</label>
        <input type="text" id="account" name="account" required autofocus>
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <button type="submit">Entrar</button>
    </form>
</body>
</html>
