{% extends 'hello/base.html' %}

{% block title %}Usuarios{% endblock %}

{% block content %}
    <h1>Usuarios</h1>

    <table class="table-user">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Cuenta</th>
                <th>Perfil</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
                <tr>
                    <td>{{ user.name }}</td>
                    <td>{{ user.account }}</td>
                    <td>{{ user.get_profile_display|default:"Sin perfil" }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
