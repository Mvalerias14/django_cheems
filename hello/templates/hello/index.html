
{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Ordenes de trabajo</title>
    <link rel="stylesheet" href="{% static 'hello/css/styles.css' %}">
</head>

<body>
    <h1>Consulta de ordenes de trabajo</h1>

    <script src="{% static 'hello/js/scripts.js' %}"></script>

    <table class="table-user">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Cuenta</th>
                <th>Perfil</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
                <tr>
                    <td>{{ user.name }}</td>
                    <td>{{ user.account }}</td>
                    <td>{{ user.profile.name }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
