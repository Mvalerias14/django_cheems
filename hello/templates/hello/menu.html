{% extends 'hello/base.html' %}

{% block title %}Menú principal{% endblock %}

{% block content %}
    <h1>Sistema de órdenes de trabajo</h1>
    <p class="subtitle">Selecciona a dónde quieres ir</p>

    <div class="cards">
        {% for o in opciones %}
            <a class="card" href="{% url o.url %}">
                <span class="card-icon">{{ o.icono }}</span>
                <span class="card-title">{{ o.titulo }}</span>
            </a>
        {% endfor %}
    </div>
{% endblock %}
